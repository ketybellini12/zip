version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    container_name: ai-builder-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://flare:password@db:5432/flaredb
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://your-domain.com}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      # AI Providers (optional)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      # Storage
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      # Billing
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ai-builder-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai-builder.rule=Host(`your-domain.com`)"
      - "traefik.http.routers.ai-builder.entrypoints=websecure"
      - "traefik.http.routers.ai-builder.tls.certresolver=letsencrypt"
      - "traefik.http.services.ai-builder.loadbalancer.server.port=3000"

  db:
    image: postgres:16-alpine
    container_name: ai-builder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: flare
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_this_in_production}
      POSTGRES_DB: flaredb
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../drizzle/migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flare -d flaredb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-builder-net
    ports:
      - "5432:5432" # Remove in production

  redis:
    image: redis:7-alpine
    container_name: ai-builder-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - ai-builder-net

  # Optional: Traefik reverse proxy for SSL/TLS
  # traefik:
  #   image: traefik:v2.10
  #   container_name: ai-builder-traefik
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - ./traefik:/etc/traefik
  #   networks:
  #     - ai-builder-net

volumes:
  postgres_data:
  redis_data:

networks:
  ai-builder-net:
    driver: bridge